name: nutrition_app
description: "AI-powered personal nutrition assistant."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking (non-Firebase HTTP, e.g. calling secure backend endpoints)
  dio: ^5.7.0

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.7
  cloud_functions: ^5.2.6
  firebase_app_check: ^0.3.2+2
  firebase_analytics: ^11.3.6
  firebase_crashlytics: ^4.2.0
  google_sign_in: ^6.2.2
  url_launcher: ^6.3.1

  # Domain/data modeling
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Design system: the synced design (see documentation/foundation.md) uses
  # "Plus Jakarta Sans" everywhere (titles, body, tabular numerics). This is
  # the standard, well-maintained way to ship a Google Font in Flutter
  # without bundling/licensing font files by hand.
  google_fonts: ^6.2.1

  # Local draft persistence for Onboarding (Epic 3): the design's confirmed
  # order is Onboarding -> Signup/Guest, so answers must survive an app
  # restart before there's any Firebase user to own a Firestore doc.
  # Flutter-team-maintained, minimal key-value store — no ORM/NoSQL engine
  # needed for a single JSON blob.
  shared_preferences: ^2.3.3

  # Camera/gallery capture for food photos (Epic 8) — Flutter-team-maintained,
  # handles both `ImageSource.camera` and `.gallery` (Instrucciones.md §6:
  # "take OR upload a photo") plus in-picker compression (`imageQuality`,
  # `maxWidth`), so no separate image-compression package is needed.
  image_picker: ^1.2.3

  # Local reminders (Epic 12): meal/plan/shopping/hydration notifications are
  # all driven by the user's own schedule (mealSlots) or a fixed cadence,
  # never a server-triggered event — on-device scheduling, no FCM/push infra
  # needed. `timezone`+`flutter_timezone` give `zonedSchedule` the device's
  # real IANA zone so a "8:00 AM daily" reminder survives DST correctly.
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
  generate: true
