name: nutrition_app
description: "AI-powered personal nutrition assistant."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking (non-Firebase HTTP, e.g. calling secure backend endpoints)
  dio: ^5.7.0

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.7
  cloud_functions: ^5.2.6
  firebase_app_check: ^0.3.2+2
  firebase_analytics: ^11.3.6
  firebase_crashlytics: ^4.2.0
  google_sign_in: ^6.2.2
  url_launcher: ^6.3.1

  # Domain/data modeling
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Design system: the synced design (see documentation/foundation.md) uses
  # "Plus Jakarta Sans" everywhere (titles, body, tabular numerics). This is
  # the standard, well-maintained way to ship a Google Font in Flutter
  # without bundling/licensing font files by hand.
  google_fonts: ^6.2.1

  # Local draft persistence for Onboarding (Epic 3): the design's confirmed
  # order is Onboarding -> Signup/Guest, so answers must survive an app
  # restart before there's any Firebase user to own a Firestore doc.
  # Flutter-team-maintained, minimal key-value store — no ORM/NoSQL engine
  # needed for a single JSON blob.
  shared_preferences: ^2.3.3

  # Camera/gallery capture for food photos (Epic 8) — Flutter-team-maintained,
  # handles both `ImageSource.camera` and `.gallery` (Instrucciones.md §6:
  # "take OR upload a photo") plus in-picker compression (`imageQuality`,
  # `maxWidth`), so no separate image-compression package is needed.
  image_picker: ^1.2.3

  # Local reminders (Epic 12): meal/plan/shopping/hydration notifications are
  # all driven by the user's own schedule (mealSlots) or a fixed cadence,
  # never a server-triggered event — on-device scheduling, no FCM/push infra
  # needed. `timezone`+`flutter_timezone` give `zonedSchedule` the device's
  # real IANA zone so a "8:00 AM daily" reminder survives DST correctly.
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  flutter_svg: ^2.3.0
  phosphor_flutter: ^2.1.0
  # En `dependencies`, no en dev: el paquete trae un plugin nativo de
  # Android que queda en GeneratedPluginRegistrant, y los builds de release
  # excluyen las dev_dependencies — estando en dev, `flutter build apk
  # --release` fallaba con "package net.jonhanson.flutter_native_splash does
  # not exist". Su propio README pide declararlo aquí.
  flutter_native_splash: ^2.4.7
  firebase_remote_config: ^5.5.0
  package_info_plus: ^10.2.2
  flutter_animate: ^4.5.2
  animations: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/brand/
    - assets/icons/
    - assets/images/

# Ícono del launcher (ASSET-103). Fuente: canvas "Marca e iconos". iOS usa
# `app_icon_1024.png` (sin alfa) + variante oscura; Android adaptativo usa
# primer plano + fondo sólido #17A86A. Regenerar con:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon_1024.png
  remove_alpha_ios: true
  adaptive_icon_background: assets/brand/app_icon_background.png
  adaptive_icon_foreground: assets/brand/app_icon_foreground.png
  web:
    generate: true
    image_path: assets/brand/app_icon_1024.png
    background_color: "#0B8F55"
    theme_color: "#0B8F55"

# Splash nativo. Fondo #0B8F55 (no #17A86A): el Splash de Flutter que le
# sigue lleva texto blanco encima y es #0B8F55 — así no hay salto de color.
# Regenerar con: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0B8F55"
  image: assets/brand/splash_logo_1152.png
  android_12:
    color: "#0B8F55"
    image: assets/brand/splash_logo_1152.png
  web: false
